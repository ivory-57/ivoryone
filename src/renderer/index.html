<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>奶盖</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="pet" aria-label="奶盖电子宠物">
      <div class="bubble" id="bubble">奶盖在看你</div>
      <button class="cat" id="cat" aria-label="摸摸奶盖">
        <span class="ear left"></span><span class="ear right"></span>
        <span class="head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i></span>
        <span class="body"></span><span class="tail"></span>
      </button>
      <div class="status"><span id="mood">心情：想贴贴</span><span id="energy">体力：80</span></div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
